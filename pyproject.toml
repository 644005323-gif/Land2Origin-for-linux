[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "land2origin"
version = "0.1.0"
description = "Pluggable scientific plotting and delivery workflows"
requires-python = ">=3.11"

[project.scripts]
land2origin = "land2origin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
